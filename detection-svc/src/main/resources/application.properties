server.port=${SERVER_PORT:7778}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fraudguard}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

fraudguard.redis.channel=fraudguard.tx.channel
fraudguard.redis.result-channel=fraudguard.result.channel
fraudguard.webhook.enabled=false

server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=never

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
